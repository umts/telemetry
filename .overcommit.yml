CommitMsg:
  ALL:
    enabled: false
PreCommit:
  ALL:
    problem_on_unmodified_line: ignore
    skip_if: ["test", "-f", ".git/MERGE_HEAD"]
  ForbiddenBranches:
    enabled: true
    branch_patterns: ["master", "main"]
  OxFmt:
    enabled: true
    required_executable: npx
    command: ["npx", "oxfmt"]
  OxLint:
    enabled: true
    required_executable: npx
    command: ["npx", "oxlint"]
  RuboCop:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "rubocop"]
